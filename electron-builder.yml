appId: com.theplumbr.drift
productName: Drift
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,components.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/*'
asarUnpack:
  - resources/**
win:
  executableName: drift
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Drift reads .env files inside workspace folders you grant.
  # Hardened runtime + notarization run automatically when APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set (release.yml).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: theplumbr.com
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# releaseType must stay `release`: release-please publishes the GitHub release
# (with the changelog) before release.yml builds, and electron-builder refuses
# to upload into an existing published release when its own type is `draft`.
publish:
  provider: github
  owner: PiperGuy
  repo: drift
  releaseType: release
