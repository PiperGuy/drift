name: Release
# Builds macOS and Linux installers for a vX.Y.Z tag and uploads them to the
# GitHub Release with that tag. Normally started by release-please.yml, which
# dispatches this workflow at the tag it just created (its release already
# exists and the assets are attached to it). A manually pushed v* tag works
# too; then electron-builder creates the release itself. Windows is
# deliberately not built. workflow_dispatch from a branch builds without
# publishing; installers land as run artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.script }} -- --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, a build re-run >2h after release-please published the
          # release would silently skip the upload (electron-publish 2h window).
          EP_GH_IGNORE_TIME: 'true'
          # Signing is optional: unset secrets yield unsigned builds, set ones sign + notarize.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: drift-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
