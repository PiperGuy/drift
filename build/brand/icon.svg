<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app-icon grid: 824x824 body at a 100px margin, ~185px corner.
       Flat layers only: per Apple's HIG the system adds depth, edge light and
       shadow, so none are baked in here. Layer sources for Icon Composer live
       in icon-layers/; see NOTES.md for the packaging steps. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2800"/>
      <stop offset="1" stop-color="#0e1200"/>
    </linearGradient>
    <linearGradient id="lemon" x1="0" y1="340" x2="0" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6ff78"/>
      <stop offset="1" stop-color="#bff23f"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g fill="none" stroke="url(#lemon)" stroke-width="112" stroke-linecap="round">
    <path d="M286 408H650"/>
    <path d="M398 616H738"/>
  </g>
  <circle cx="268" cy="616" r="52" fill="url(#lemon)"/>
</svg>
